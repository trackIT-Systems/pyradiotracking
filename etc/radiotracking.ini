[optional arguments]
# increase output verbosity
verbose = 2
# enable calibration mode
calibrate = False
# configuration file
config = 'etc/radiotracking.ini'
# name of the station
station = 'test'

[rtl-sdr]
# device indexes or names
device = [0]
# device calibration gain (db)
calibration = [0.0]
# per device: input power (dBm) at the antenna port that gives a full scale tone at 0 dB total gain (LNA + mixer + VGA);
# devices with a value also publish their powers in dBm, see the Readme. Empty: dBW only.
fullscale_dbm = []
# center frequency to tune to (hz)
center_freq = 150150000
# sample rate (hz)
sample_rate = 300000
# number of samples to read per batch
sdr_callback_length = None
# gain (db), only used if the gain stages below can not be set separately (the original librtlsdr, tuners other than
# R820T/R828D)
gain = 49.6

# gain of the stages as indexes, with the measured steps of librtlsdr, see
# https://github.com/trackIT-Systems/librtlsdr/blob/v0.9.1/src/tuner_r82xx.c#L1340-L1352
# total gain = LNA + mixer + VGA, 49.6 dB LNA and mixer (15 / 14) are the maximum
# lna gain, 0 .. 15 (0 .. 33.5 dB)
lna_gain = 15
# mixer gain, 0 .. 15 (0 .. 16.1 dB, 15 has less than 14)
mixer_gain = 14
# vga gain, 0 .. 15 (-4.7 .. 40.8 dB). The default 8 (16.3 dB, total 65.9 dB) is the fixed VGA gain of the original
# librtlsdr, 15 saturates the ADC on noise. The tsOS-vhf image sets 7 (total 64.5 dB)
vga_gain = 8

# maximal restart count per sdr device
sdr_max_restart = 3
# time after which an sdr device is considered unrepsonsive (s)
sdr_timeout_s = 2
# False: pin each SDR to a CPU (device_index %% ncpu); True: OS dynamic scheduling
sdr_dynamic_scheduling = False
# interval for publishing the noise and snr per frequency (s); <=0 disables
spectrum_interval_s = 300.0

[analysis]
# optional: override IQ samples per analysis chunk (default 0.3 s of IQ, aligned to fft_nperseg), should be at least 6 times the maximum signal duration
# analysis_block_samples = 90112
# fft number of samples
fft_nperseg = 256
# fft window function
fft_window = 'hamming'
# lower limit for signal intensity (dbw)
signal_threshold_dbw = -90.0
# lower limit for signal-to-noise ratio (db)
snr_threshold_db = 5.0
# lower limit for signal duration (ms)
signal_min_duration_ms = 8
# upper limit for signal duration (ms)
signal_max_duration_ms = 50

[matching]
# timeout for adding signals to a match group
matching_timeout_s = 2.0
# error margin for timestamp matching (s)
matching_time_diff_s = 0
# error margin for frequency (hz)
matching_bandwidth_hz = 0
# error margin for duration (ms)
matching_duration_diff_ms = None

[publish]
# enable stdout signal publishing
sig_stdout = False
# enable stdout matched signals publishing
match_stdout = False
# file output path
path = 'data'
# enable csv data publishing
csv = False
# export configuration
export_config = False
# enable mqtt data publishing
mqtt = True
# hostname of mqtt broker
mqtt_host = 'localhost'
# port of mqtt broker
mqtt_port = 1883
# mqtt quality of service level (0, 1, 2)
mqtt_qos = 1
# timeout for mqtt connection (s)
mqtt_keepalive = 3600
# mqtt client id (default: <hostname>-radiotracking), must differ for every instance using the broker
mqtt_client_id = None
